services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weather_oms
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather_oms"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:

