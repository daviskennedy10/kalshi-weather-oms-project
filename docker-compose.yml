services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weather_oms
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U weather -d weather_oms
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  collector:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://weather:weather@postgres:5432/weather_oms
      FORECAST_REFRESH_SECONDS: 900
      SETTLEMENT_REFRESH_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

