[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-kalshi-oms"
version = "0.1.0"
description = "Event-driven paper trading system for Kalshi weather markets"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
weather-oms = "weather_oms.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_oms"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

